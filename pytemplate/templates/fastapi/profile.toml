id = "fastapi"
name = "FastAPI service"
description = "An asynchronous FastAPI service foundation with database and API examples."
version = "2"
supported_python = ["3.11", "3.12", "3.13", "3.14"]
components = ["api", "database"]
default_components = ["api", "database"]
configuration_schema = "questions.yml"
lifecycle_commands = ["uv sync", "uv run ruff check .", "uv run ruff format --check .", "uv run mypy {package}", "uv run pytest"]
security_posture = "The profile renders local development defaults only; production secrets and infrastructure are explicit configuration."
