name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test-and-build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv run --extra dev pytest
      - run: uv build

  profile-smoke:
    needs: test-and-build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        profile: [python, fastapi]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - run: uv run --extra dev pytemplate create profile-smoke --profile ${{ matrix.profile }} --output-dir . --no-input
      - run: uv run --extra dev pytest
        working-directory: profile-smoke
