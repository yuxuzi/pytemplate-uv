# Keeps the SHA-pinned GitHub Actions and the uv lockfile current. The cooldown waits a week
# after a release before proposing it, so a compromised release is usually yanked first.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
