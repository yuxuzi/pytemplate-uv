contract = 1
id = "fastapi"
name = "FastAPI service"
description = "A layered FastAPI service: health and readiness, structured logs, and opt-in database, worker, and auth."
version = "3"
kind = "service"
status = "stable"
supported_python = ["3.11", "3.12", "3.13", "3.14", "3.15"]
default_components = ["api"]
optional_components = ["auth", "auth-api-key", "auth-oidc", "container", "database", "worker"]
legacy_components = ["container", "database"]
dependencies = ["rich>=13.7", "typer>=0.12"]
questions = ["description", "author", "email", "python_version", "license"]
lifecycle_commands = ["uv sync", "uv run ruff check .", "uv run ruff format --check .", "uv run mypy {package}", "uv run pytest"]
security_posture = "Rendering contacts no service. The default service needs no database, identity provider, or secret; production settings refuse wildcard hosts, open CORS, and debug mode."

[dependency_groups]
dev = ["httpx>=0.27", "mypy>=1.11", "pytest>=8.0", "pytest-asyncio>=0.24", "pytest-cov>=5.0", "ruff>=0.6"]
