name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check pytemplate tests
      - run: uv run mypy

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked
      - run: uv run pytest

  generated-projects:
    # Render every profile and run its own lifecycle commands (sync, lint, format, mypy, tests).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.14"]
    runs-on: ${{ matrix.os }}
    env:
      PYTEMPLATE_SMOKE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked
      - run: uv run pytest tests/test_generated_projects.py

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
      - run: uv build
      - run: uvx twine check --strict dist/*
      - name: Generate projects from the built wheel
        run: |
          wheel="$(ls dist/*.whl)"
          for profile in python fastapi; do
            uvx --from "$wheel" pytemplate create "wheel-$profile" --profile "$profile" \
              --output-dir "$RUNNER_TEMP" --no-input
            for path in .gitignore .github/workflows/ci.yml CLAUDE.md .pytemplate.toml \
                .copier-answers.yml; do
              test -f "$RUNNER_TEMP/wheel-$profile/$path"
            done
          done
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
