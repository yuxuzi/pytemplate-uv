[project]
name = "pytemplate-uv"
version = "2.1.0"
description = "A deterministic CLI that generates uv-native Python and FastAPI projects from Copier templates."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Leo Liu", email = "yuxuzi@gmail.com" }]
keywords = ["uv", "copier", "template", "project-generator", "scaffold", "fastapi", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = [
    "copier>=9.4,<10",
    "rich>=13.7.0",
    "typer>=0.12.0",
]

[project.urls]
Homepage = "https://github.com/yuxuzi/pytemplate-uv"
Repository = "https://github.com/yuxuzi/pytemplate-uv"
Issues = "https://github.com/yuxuzi/pytemplate-uv/issues"
Changelog = "https://github.com/yuxuzi/pytemplate-uv/blob/main/CHANGELOG.md"

[project.scripts]
pytemplate = "pytemplate.main:app"
pytemplate-uv = "pytemplate.main:app"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "pytemplate"
module-root = ""
source-include = ["tests/**", "CHANGELOG.md"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["pytemplate/templates"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "C90",  # mccabe complexity
    "N",    # pep8-naming
    "D",    # pydocstyle
]
ignore = [
    "D100",  # Missing docstring in public module
    "D101",  # Missing docstring in public class
    "D203",  # Conflicts with D211
    "D213",  # Conflicts with D212
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D103"]  # Ignore missing docstrings in tests

[tool.mypy]
python_version = "3.11"
strict = true
files = ["pytemplate"]
exclude = ["^pytemplate/templates/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
